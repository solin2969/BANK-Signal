name: live-paper-trading

on:
  schedule:
    - cron: "3 * * * *" # every hour, 3 minutes past (after the 1h candle closes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pandas numpy

      - name: Run the hourly step
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/live_run.py

      - name: Commit state and dashboard
        run: |
          git config user.name "bank-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "live: hourly state update [skip ci]"
          git pull --rebase && git push
